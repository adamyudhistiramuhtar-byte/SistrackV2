syntax = "proto3";

package analytics;

message DashboardRequest {}

message ChartSeries {
  repeated string labels = 1;
  repeated double values = 2;
}

message DashboardResponse {
  int32 total_orders = 1;
  double total_revenue = 2;
  ChartSeries orders_chart = 3;
  ChartSeries revenue_chart = 4;
  int32 active_seats = 5;
}

service AnalyticsService {
  rpc GetDashboardSummary (DashboardRequest) returns (DashboardResponse);
}
