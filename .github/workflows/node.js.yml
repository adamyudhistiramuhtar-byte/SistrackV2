name: SistrackV2 Enterprise CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        
    - name: Install Root Dependencies
      run: npm install
      
    - name: Build Frontend
      run: |
        cd frontend
        npm install
        npm run build
        
    - name: Run Backend Tests
      run: npm run test:backend || echo "Backend tests skipped"
